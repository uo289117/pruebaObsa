
<!DOCTYPE html>
<html lang="es" class="no-js">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="shortcut icon" href="archivos_de_interes/OBSA.png">
	<link rel="profile" href="http://gmpg.org/xfn/11">
		<link href="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/fonts/font-awesome/font-awesome.css" rel="stylesheet" />
		
        <script src="https://code.jquery.com/jquery-3.1.1.min.js" integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8=" crossorigin="anonymous"></script>
		<link href="https://cdn.datatables.net/1.10.15/css/jquery.dataTables.min.css" rel="stylesheet">
		<link rel="stylesheet" href="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/css/tablesaw.css">
		<link rel="stylesheet" href="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/css/tabby.css">
    <link rel="stylesheet" href="css/styles.css" />

    <script src="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/script/indicadores-resumen.js" type="text/javascript"></script>
	<script src="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/script/combo.js" type="text/javascript"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

	<!-- CABECERA ROJA -->
    <header class="header-obsa" style="
        width: 100%;
        background: #c8102e;
        color: #fff;
        padding: 0;
        margin: 0;
    ">
        <nav class="menu-obsa" style="
            display: flex;
            gap: 40px;
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            font-family: Arial, sans-serif;
        ">
            <a href="#" style="color:white; text-decoration:none;">¿QUÉ ES EL OBSA?</a>
            <a href="#" style="color:white; text-decoration:none;">INFORMACIÓN MUNICIPAL</a>
            <a href="#" style="color:white; text-decoration:none;">SITUACIÓN DE SALUD</a>
            <a href="#" style="color:white; text-decoration:none;">RECURSOS DE SALUD</a>
            <a href="#" style="color:white; text-decoration:none;">HERRAMIENTAS</a>
            <a href="#" style="color:white; text-decoration:none;">DOCUMENTOS</a>
        </nav>
    </header>

      <!-- CONTENIDO PRINCIPAL -->
    <div style="display:flex; padding:40px; font-family:Arial, sans-serif;">

        <!-- COLUMNA IZQUIERDA -->
        <aside style="width:300px; padding-right:40px;">

            <h2 style="color:#1f8f41; font-size:26px; margin:0;">DETERMINANTES</h2>
            <!-- LISTA DE INDICADORES DINÁMICOS -->
            <div id="lista-indicadores" style="line-height:1.7; cursor:pointer;"></div>

        </aside>

        <!-- COLUMNA DERECHA -->
        <main style="flex-grow:1;">

            <!-- CONTENEDOR SELECT AÑO + MODO -->
            <div style="display:flex; gap:20px; align-items:center;">

                <select id="añoSelect" style="font-size:18px; padding:6px;">
                    <option>2019</option>
                    <option>2020</option>
                    <option>2021</option>
                </select>

                <select id="modoSelect" style="font-size:18px; padding:6px;">
                    <option value="mapa">Mapa</option>
                    <option value="bar">Barras</option>
                    <option value="line">Evolución</option>
                </select>

                <select id="concejoSelect" style="font-size:18px; padding:6px;"></select>

            </div>

            <h1 style="color:#40a64f; font-size:40px; margin-top:20px;">Determinantes de salud</h1>

			<div class="mapadiv" id="mapaContainer">
           <div data-role="mapa-svg"></div>
    </div>

	<div id="leyenda">
    <div class="texto_leyenda_izda">Mejores resultados</div>
    
    <div class="imagenes_leyenda">
        <img src="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/img/cuartil4_det.png" title="Cuartil 1" class="img_cuartil"/>
        <img src="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/img/cuartil3_det.png" title="Cuartil 2" class="img_cuartil"/>
        <img src="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/img/cuartil2_det.png" title="Cuartil 3" class="img_cuartil"/>
        <img src="https://obsaludasturias.com/obsa/wp-content/themes/twentysixteen-child/img/cuartil1_det.png" title="Cuartil 4" class="img_cuartil"/>
    </div>
    
      <div class="texto_leyenda_dcha">Peores resultados</div>
  </div>

  <div id="graficoContainer">
      <canvas id="graficoCanvas"></canvas>
  </div>

    </main>

    </div>
    
  <div id="infoBox">
    <h3 id="nombre"></h3>
    <p><b>Indicador:</b> <span id="indicador"></span></p>
    <p><b>Valor:</b> <span id="valor"></span></p>
    <button onclick="cerrarInfo()">Cerrar</button>
  </div>

  <script src="js/functions.js"></script>
</body>
</html>
